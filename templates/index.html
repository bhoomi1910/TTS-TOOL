<!DOCTYPE html>
<html>

<head>

<title>AI Voice Generator</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f172a;
font-family:Arial;
color:white;
padding:30px;
}

.container{

max-width:900px;
margin:auto;
background:#111827;
padding:30px;
border-radius:20px;
box-shadow:0px 0px 25px rgba(0,0,0,0.5);

}

h1{

text-align:center;
margin-bottom:30px;
font-size:40px;
color:#60a5fa;

}

textarea{

width:100%;
height:220px;
padding:20px;
border:none;
border-radius:15px;
font-size:16px;
resize:none;
background:#1e293b;
color:white;
outline:none;

}

.options{

display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
margin-top:25px;

}

.option-box{

background:#1e293b;
padding:20px;
border-radius:15px;

}

label{

display:block;
margin-bottom:10px;
font-size:17px;

}

select{

width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
background:#334155;
color:white;
outline:none;

}

button{

background:#2563eb;
color:white;
border:none;
padding:15px 30px;
font-size:18px;
border-radius:12px;
cursor:pointer;
margin-top:30px;
transition:0.3s;

}

button:hover{

background:#1d4ed8;

}

audio{

width:100%;
margin-top:30px;

}

.download-box{

text-align:center;
margin-top:25px;

}

#status{

margin-top:20px;
text-align:center;
font-size:18px;
color:#93c5fd;

}

@media(max-width:768px){

.options{

grid-template-columns:1fr;

}

h1{

font-size:28px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>🎙 AI Voice Generator</h1>

<form id="form">

<textarea
name="text"
placeholder="Enter long text here for AI voice generation..."
required>
</textarea>

<div class="options">

<div class="option-box">

<label>Select Voice</label>

<select name="voice">

{% for v in voices %}

<option value="{{v}}">
{{v}}
</option>

{% endfor %}

</select>

</div>

<div class="option-box">

<label>Voice Speed</label>

<select name="speed">

<option value="-50%">
Very Slow
</option>

<option value="-20%">
Slow
</option>

<option value="+0%" selected>
Normal
</option>

<option value="+20%">
Fast
</option>

<option value="+50%">
Very Fast
</option>

</select>

</div>

<div class="option-box">

<label>Voice Pitch</label>

<select name="pitch">

<option value="-20Hz">
Deep
</option>

<option value="+0Hz" selected>
Normal
</option>

<option value="+20Hz">
High
</option>

</select>

</div>

</div>

<div style="text-align:center;">

<button
id="generateBtn"
type="submit">

Generate Audio

</button>

</div>

</form>

<div id="status"></div>

<audio
id="audio"
controls>
</audio>

<div class="download-box">

<a
id="downloadLink"
style="display:none;"
download>

<button>
Download MP3
</button>

</a>

</div>

</div>

<script>

document.getElementById("form").onsubmit =
async function(e){

e.preventDefault();

let button =
document.getElementById("generateBtn");

let status =
document.getElementById("status");

status.innerText =
"Generating audio...";

button.disabled = true;

button.innerText =
"Generating...";

let data =
new FormData(this);

try{

let response =
await fetch("/generate",{

method:"POST",
body:data

});

let result =
await response.json();

if(result.success){

let audio =
document.getElementById("audio");

audio.src =
result.audio_url +
"?t=" + new Date().getTime();

audio.load();

audio.play();

let downloadLink =
document.getElementById("downloadLink");

downloadLink.href =
result.audio_url;

downloadLink.style.display =
"inline";

status.innerText =
"Audio generated successfully";

}
else{

status.innerText =
result.error;

}

}
catch(error){

status.innerText =
"Error generating audio";

}

button.disabled = false;

button.innerText =
"Generate Audio";

}

</script>

</body>
</html>
